# ==========================================
# PRODUCTION ENVIRONMENT CONFIGURATION
# ==========================================

# Server Configuration
server.port=8081

# Datasource Configuration (Production - Docker Container)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://hotel_db:3306/hotel}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Configuration (Production Optimization)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson Configuration
spring.jackson.deserialization.fail-on-unknown-properties=true

# OAuth2 Resource Server - Keycloak (Production - Docker Container)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/hotelrealm}

# Keycloak Admin Configuration (Production - Docker Container)
keycloak.admin.server-url=${KEYCLOAK_SERVER_URL:http://keycloak:8080}
keycloak.admin.realm=master
keycloak.admin.client-id=admin-cli
keycloak.admin.username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:admin}
keycloak.admin.target-realm=hotelrealm

# Stripe Configuration (Production - Use Environment Variables)
stripe.api.public.key=${STRIPE_PUBLIC_KEY:}
stripe.api.secret.key=${STRIPE_SECRET_KEY:}

# Mail Configuration (Production)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Logging Configuration (Production - Less Verbose)
logging.level.root=WARN
logging.level.com.nourproject=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN

# Security Headers (Production)
server.error.include-message=never
server.error.include-stacktrace=never

# Face Recognition Configuration (Production)
face.recognition.threshold=0.85
face.recognition.upload.dir=${FACE_RECOGNITION_UPLOAD_DIR:./face-uploads}
face.recognition.service.url=${FACE_RECOGNITION_SERVICE_URL:http://face-recognition:5000}
# Keep files by default, can be overridden
face.recognition.keep.files=${FACE_RECOGNITION_KEEP_FILES:true}
