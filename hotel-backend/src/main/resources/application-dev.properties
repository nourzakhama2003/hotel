# ==========================================
# DEVELOPMENT ENVIRONMENT CONFIGURATION
# ==========================================

# Server Configuration
server.port=8082

# Datasource Configuration (Local Development)
spring.datasource.url=jdbc:mysql://localhost:3306/hotel
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson Configuration
spring.jackson.deserialization.fail-on-unknown-properties=true

# OAuth2 Resource Server - Keycloak (Local Development)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/hotelrealm/protocol/openid-connect/certs

# Keycloak Admin Configuration (Local Development)
keycloak.admin.server-url=http://localhost:8080
keycloak.admin.realm=master
keycloak.admin.client-id=admin-cli
keycloak.admin.username=admin
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:}
keycloak.admin.target-realm=hotelrealm

# Stripe Configuration (Test Keys for Development)
stripe.api.public.key=${STRIPE_PUBLIC_KEY:pk_test_51S1GWi4BxFUD5s92q3WSd0x9yKDzJtTTR4Vc2orIISwUOV97wVBhn6elbNRM7Vs1MNqrAlO7J12ZQ2xtHk32bqWn00mt8IdCtC}
stripe.api.secret.key=${STRIPE_SECRET_KEY:}

# Mail Configuration (Development)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Logging Configuration (Development - Verbose)
logging.level.root=INFO
logging.level.com.nourproject=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Face Recognition Configuration (Development)
face.recognition.threshold=0.85
face.recognition.upload.dir=${FACE_RECOGNITION_UPLOAD_DIR:./face-uploads}
face.recognition.service.url=${FACE_RECOGNITION_SERVICE_URL:http://localhost:5000}
# Keep files for debugging in development
face.recognition.keep.files=${FACE_RECOGNITION_KEEP_FILES:true}
