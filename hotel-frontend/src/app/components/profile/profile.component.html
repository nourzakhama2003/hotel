<div>
  <form
    [formGroup]="profileForm"
    class="flex flex-col gap-4 p-4"
    (ngSubmit)="onSubmit()"
  >
    <div class="flex items-start gap-4 mb-4">
      <img
        [src]="selectedImage"
        alt="Profile Image"
        class="w-32 h-32 rounded-full border-2 border-green-500"
      />
      <div class="flex flex-col gap-2">
        <input type="file" accept="image/*" (change)="onFileSelected($event)" />

        <!-- Face Recognition Button -->
        <button
          *ngIf="!showFaceCapture"
          type="button"
          class="p-2 rounded-md bg-blue-500 text-white hover:bg-blue-600 text-sm flex items-center gap-2"
          (click)="openFaceCapture()"
        >
          <i class="pi pi-camera"></i>
          <span>{{ faceRegistered ? "Update Face" : "Register Face" }}</span>
        </button>

        <!-- Face Recognition Status Badge -->
        <div
          *ngIf="faceRegistered"
          class="flex items-center gap-2 p-2 bg-green-50 border border-green-300 rounded-md"
        >
          <i class="pi pi-check-circle text-green-600"></i>
          <span class="text-green-700 text-sm font-medium"
            >Face Recognition Enabled</span
          >
        </div>
      </div>
    </div>

    <!-- Face Capture Component (shown when button clicked) -->
    <div *ngIf="showFaceCapture" class="mb-4">
      <app-face-capture
        (imageCaptured)="onImageCaptured($event)"
        (captureCancelled)="onCaptureCancelled()"
      ></app-face-capture>
    </div>

    <label for="name">userName</label>
    <input type="text" id="name" formControlName="userName" readonly />

    <label for="email">Email:</label>
    <input type="email" id="email" formControlName="email" readonly />

    <label for="firstName">firstName:</label>
    <input type="text" id="firstName" formControlName="firstName" />

    <label for="lastName">Last Name:</label>
    <input type="text" id="lastName" formControlName="lastName" />

    <div class="flex justify-between p-4 mt-4">
      <button
        type="button"
        class="p-2 rounded-md bg-red-500"
        (click)="onClose()"
      >
        annuler
      </button>
      <button type="submit" class="p-2 rounded-md bg-green-500">Update</button>
    </div>
  </form>
</div>
