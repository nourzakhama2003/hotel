<div class="chatbot-container" [class.open]="isOpen">
  <!-- Floating Chat Button -->
  <button
    *ngIf="!isOpen"
    class="chat-button"
    (click)="toggleChat()"
    aria-label="Open chat"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"
      />
    </svg>
    <span class="pulse-ring"></span>
  </button>

  <!-- Chat Window -->
  <div *ngIf="isOpen" class="chat-window" [class.minimized]="isMinimized">
    <!-- Header -->
    <div class="chat-header">
      <div class="header-content">
        <div class="bot-avatar">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"
            />
          </svg>
        </div>
        <div class="header-text">
          <h3>Hotel Assistant</h3>
          <p class="status">
            <span class="status-dot"></span>
            Online
          </p>
        </div>
      </div>
      <div class="header-actions">
        <button
          (click)="toggleMinimize()"
          class="icon-button"
          aria-label="Minimize"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M20 12H4"
            />
          </svg>
        </button>
        <button (click)="closeChat()" class="icon-button" aria-label="Close">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>
    </div>

    <!-- Messages -->
    <div #chatMessages class="chat-messages">
      <div
        *ngFor="let message of messages"
        class="message"
        [class.user-message]="message.role === 'user'"
        [class.assistant-message]="message.role === 'assistant'"
      >
        <div class="message-avatar" *ngIf="message.role === 'assistant'">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M13 10V3L4 14h7v7l9-11h-7z"
            />
          </svg>
        </div>
        <div class="message-content">
          <p>{{ message.content }}</p>

          <!-- Hotel cards if available -->
          <div
            *ngIf="message.hotels && message.hotels.length > 0"
            class="hotel-cards"
          >
            <div *ngFor="let hotel of message.hotels" class="hotel-card">
              <img
                *ngIf="
                  hotel.image_url && !hotel.image_url.includes('example.com')
                "
                [src]="hotel.image_url"
                [alt]="hotel.name"
                class="hotel-image"
                (error)="$any($event.target).style.display = 'none'"
              />
              <div class="hotel-info">
                <h4>{{ hotel.name }}</h4>
                <p class="hotel-location">📍 {{ hotel.location }}</p>
                <p class="hotel-description">{{ hotel.description }}</p>
                <div class="hotel-details">
                  <span class="hotel-price">${{ hotel.price }}<small>/night</small></span>
                  <span class="hotel-rating">★ {{ hotel.rating }}</span>
                </div>
                <p class="hotel-amenities" *ngIf="hotel.amenities">
                  {{ hotel.amenities.replace("|", ", ") }}
                </p>
                <button class="book-button" (click)="bookHotel(hotel.name!)">
                  Book Now
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <span class="message-time">{{
            message.timestamp | date : "shortTime"
          }}</span>
        </div>
        <div class="message-avatar" *ngIf="message.role === 'user'">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
            />
          </svg>
        </div>
      </div>

      <!-- Loading indicator -->
      <div *ngIf="isLoading" class="message assistant-message">
        <div class="message-avatar">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M13 10V3L4 14h7v7l9-11h-7z"
            />
          </svg>
        </div>
        <div class="message-content">
          <div class="typing-indicator">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="quick-actions" *ngIf="messages.length <= 1">
      <p class="quick-actions-title">Quick suggestions:</p>
      <div class="action-buttons">
        <button
          *ngFor="let action of quickActions"
          class="action-button"
          (click)="useQuickAction(action)"
        >
          {{ action }}
        </button>
      </div>
    </div>

    <!-- Input -->
    <div class="chat-input">
      <input
        type="text"
        [(ngModel)]="userInput"
        (keyup.enter)="sendMessage()"
        [disabled]="isLoading"
        placeholder="Ask about hotels..."
        class="input-field"
      />
      <button
        (click)="sendMessage()"
        [disabled]="!userInput.trim() || isLoading"
        class="send-button"
        aria-label="Send message"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"
          />
        </svg>
      </button>
    </div>
  </div>
</div>
