<div class="hotel-card-container">
  <!-- Hotel Card -->
  <div class="hotel-card group">
    <!-- Image Container with Overlay -->
    <div class="image-container relative overflow-hidden">
      <img
        class="hotel-image"
        [src]="hotel.hotelImage || '/assets/images/hotelDefault.jpg'"
        [alt]="hotel.hotelName"
        loading="lazy"
      />

      <!-- Image Overlay with Gradient -->
      <div class="image-overlay"></div>

      <!-- Hotel Name Badge -->
      <div class="hotel-name-badge">
        {{ hotel.hotelName }}
      </div>

      <!-- Status Badge -->
      <div class="status-badge">
        <span class="status-icon">🏨</span>
        <span class="status-text">Available</span>
      </div>
    </div>

    <!-- Card Content -->
    <div class="card-content">
      <!-- Hotel Header -->
      <div class="hotel-header">
        <div class="hotel-title-section">
          <h3 class="hotel-name">{{ hotel.hotelName }}</h3>
          <p class="hotel-subtitle">Luxury Hotel Experience</p>
        </div>

        <div class="rating-badge">
          <svg class="rating-icon" fill="currentColor" viewBox="0 0 20 20">
            <path
              d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"
            />
          </svg>
          4.8
        </div>
      </div>

      <!-- Hotel Features -->
      <div class="hotel-features">
        <div class="feature-item">
          <svg class="feature-icon" fill="currentColor" viewBox="0 0 20 20">
            <path
              d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM3 10a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6zM14 9a1 1 0 00-1 1v6a1 1 0 001 1h2a1 1 0 001-1v-6a1 1 0 00-1-1h-2z"
            />
          </svg>
          Premium Suites
        </div>
        <div class="feature-item">
          <svg class="feature-icon" fill="currentColor" viewBox="0 0 20 20">
            <path
              fill-rule="evenodd"
              d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z"
              clip-rule="evenodd"
            />
          </svg>
         {{hotel.hotelLocation}}
        </div>
      </div>

      <!-- View Rooms Button -->
      <div class="view-rooms-section">
        <button [routerLink]="['/hotel/rooms', hotel.id]" class="view-rooms-btn">
          <svg class="btn-icon" fill="currentColor" viewBox="0 0 20 20">
            <path
              fill-rule="evenodd"
              d="M3 3a1 1 0 000 2v8a2 2 0 002 2h2.586l-1.293 1.293a1 1 0 101.414 1.414L10 15.414l2.293 2.293a1 1 0 001.414-1.414L12.414 15H15a2 2 0 002-2V5a1 1 0 100-2H3zm11.707 4.707a1 1 0 00-1.414-1.414L10 9.586 6.707 6.293a1 1 0 00-1.414 1.414l4 4a1 1 0 001.414 0l4-4z"
              clip-rule="evenodd"
            />
          </svg>
          View Rooms
        </button>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="card-actions" *ngIf="isAdmin">
      <button
        class="action-btn edit-btn"
        (click)="onUpdateHotel(hotel)"
        title="Edit Hotel"
      >
        <svg class="btn-icon" fill="currentColor" viewBox="0 0 20 20">
          <path
            d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"
          />
        </svg>
        Edit
      </button>
      <button
        class="action-btn delete-btn"
        (click)="onDeleteHotel(hotel.id)"
        title="Delete Hotel"
      >
        <svg class="btn-icon" fill="currentColor" viewBox="0 0 20 20">
          <path
            fill-rule="evenodd"
            d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"
            clip-rule="evenodd"
          />
          <path
            fill-rule="evenodd"
            d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 6.707 8.293a1 1 0 00-1.414 1.414L8.586 12l-3.293 3.293a1 1 0 101.414 1.414L9 13.414l2.293 2.293a1 1 0 001.414-1.414L9.414 12l3.293-3.293z"
            clip-rule="evenodd"
          />
        </svg>
        Delete
      </button>
    </div>
  </div>
</div>
